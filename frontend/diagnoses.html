<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareTrack Clinic - Diagnoses Directory</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">CT</div>
        <div class="logo-text">
          <h2>CareTrack</h2>
          <span>Clinic Registry</span>
        </div>
      </div>

      <nav class="sidebar-menu">
        <a href="/dashboard.html" class="menu-item">
          <i class="fa-solid fa-chart-line"></i> Dashboard
        </a>
        <a href="/doctors.html" class="menu-item">
          <i class="fa-solid fa-user-doctor"></i> Doctors
        </a>
        <a href="/patients.html" class="menu-item">
          <i class="fa-solid fa-hospital-user"></i> Patients
        </a>
        <a href="/diagnoses.html" class="menu-item active" id="menu-diagnoses">
          <i class="fa-solid fa-file-medical"></i> Diagnoses
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-badge">
          <div class="user-avatar" id="nav-avatar">U</div>
          <div class="user-info">
            <span class="user-name" id="nav-username">Loading...</span>
            <span class="user-role" id="nav-role">Role</span>
          </div>
        </div>
        <button class="btn-logout" id="btn-logout">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="top-navbar">
        <div class="page-title">
          <h1>Diagnoses Directory</h1>
        </div>
      </header>

      <div class="content-wrapper">
        <div class="action-header">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-diagnoses" class="form-control" placeholder="Search by ICD, patient name or description...">
          </div>
          <!-- Let the page be search-oriented, creation can be done via Patient profile easily or direct modal if patient is selectable -->
          <!-- We will support Add Diagnosis from this registry page as well by choosing a patient! -->
          <button class="btn-mrms btn-primary" id="btn-open-diagnosis-modal" style="display: none;">
            <i class="fa-solid fa-plus"></i> Record Diagnosis
          </button>
        </div>

        <div class="card-glass">
          <div class="table-responsive">
            <table class="mrms-table" id="diagnoses-table">
              <thead>
                <tr>
                  <th>ICD-10</th>
                  <th>Patient</th>
                  <th>Severity</th>
                  <th>Description</th>
                  <th>Date Recorded</th>
                  <th class="actions-column" style="display: none; text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="diagnoses-table-body">
                <tr>
                  <td colspan="6" style="text-align: center; color: var(--text-secondary);">Loading diagnoses database...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Record Diagnosis Modal (Standard selection for adding/updating) -->
  <div class="modal-backdrop" id="diagnosis-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="diagnosis-modal-title">Record Diagnosis</h3>
        <button class="modal-close" id="btn-close-diagnosis-modal">&times;</button>
      </div>
      <form id="diagnosis-form">
        <div class="modal-body">
          <input type="hidden" id="diagnosis-id">
          
          <div class="form-group" id="patient-select-group">
            <label for="diag-patient">Select Patient</label>
            <select id="diag-patient" class="form-control" required>
              <option value="" disabled selected>Choose a Patient</option>
              <!-- Populated dynamically -->
            </select>
          </div>

          <div class="form-group">
            <label for="diag-icd">ICD-10 Code</label>
            <input type="text" id="diag-icd" class="form-control" placeholder="e.g. I10 or E11.9" required>
          </div>

          <div class="form-group">
            <label for="diag-severity">Severity Level</label>
            <select id="diag-severity" class="form-control" required>
              <option value="" disabled selected>Select Severity</option>
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
              <option value="Critical">Critical</option>
            </select>
          </div>

          <div class="form-group">
            <label for="diag-desc">Clinical Description</label>
            <textarea id="diag-desc" class="form-control" rows="4" placeholder="Enter clinical notes, symptoms, or findings..." required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-mrms btn-secondary" id="btn-cancel-diagnosis-form">Cancel</button>
          <button type="submit" class="btn-mrms btn-primary" id="btn-save-diagnosis">Save Record</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>
  <div id="loader-overlay" class="loader-overlay">
    <div class="spinner"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/diagnoses.js"></script>
</body>
</html>

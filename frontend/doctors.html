<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareTrack Clinic - Doctors Registry</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">CT</div>
        <div class="logo-text">
          <h2>CareTrack</h2>
          <span>Clinic Registry</span>
        </div>
      </div>

      <nav class="sidebar-menu">
        <a href="/dashboard.html" class="menu-item">
          <i class="fa-solid fa-chart-line"></i> Dashboard
        </a>
        <a href="/doctors.html" class="menu-item active">
          <i class="fa-solid fa-user-doctor"></i> Doctors
        </a>
        <a href="/patients.html" class="menu-item">
          <i class="fa-solid fa-hospital-user"></i> Patients
        </a>
        <a href="/diagnoses.html" class="menu-item" id="menu-diagnoses">
          <i class="fa-solid fa-file-medical"></i> Diagnoses
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-badge">
          <div class="user-avatar" id="nav-avatar">U</div>
          <div class="user-info">
            <span class="user-name" id="nav-username">Loading...</span>
            <span class="user-role" id="nav-role">Role</span>
          </div>
        </div>
        <button class="btn-logout" id="btn-logout">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="top-navbar">
        <div class="page-title">
          <h1>Doctors Registry</h1>
        </div>
      </header>

      <div class="content-wrapper">
        <div class="action-header">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-doctors" class="form-control" placeholder="Search by name, specialty or department...">
          </div>
          <!-- Register Button (Admin only) -->
          <button class="btn-mrms btn-primary" id="btn-open-doctor-modal" style="display: none;">
            <i class="fa-solid fa-user-plus"></i> Register Doctor
          </button>
        </div>

        <div class="card-glass">
          <div class="table-responsive">
            <table class="mrms-table" id="doctors-table">
              <thead>
                <tr>
                  <th>Full Name</th>
                  <th>Specialty</th>
                  <th>Department</th>
                  <th>Contact Info</th>
                  <th class="actions-column" style="display: none; text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="doctors-table-body">
                <!-- Dynamically populated -->
                <tr>
                  <td colspan="5" style="text-align: center; color: var(--text-secondary);">Loading doctors directory...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Doctor Form Modal (Register & Edit) -->
  <div class="modal-backdrop" id="doctor-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="doctor-modal-title">Register Doctor</h3>
        <button class="modal-close" id="btn-close-doctor-modal">&times;</button>
      </div>
      <form id="doctor-form">
        <div class="modal-body">
          <input type="hidden" id="doctor-id">
          
          <div class="form-group">
            <label for="doc-name">Full Name</label>
            <input type="text" id="doc-name" class="form-control" placeholder="e.g. Dr. Arthur Conan" required>
          </div>

          <div class="form-group">
            <label for="doc-specialty">Specialty</label>
            <input type="text" id="doc-specialty" class="form-control" placeholder="e.g. Cardiology" required>
          </div>

          <div class="form-group">
            <label for="doc-department">Department</label>
            <input type="text" id="doc-department" class="form-control" placeholder="e.g. Cardiology Department" required>
          </div>

          <div class="form-group">
            <label for="doc-contact">Contact Info</label>
            <input type="text" id="doc-contact" class="form-control" placeholder="e.g. +998901234567" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-mrms btn-secondary" id="btn-cancel-doctor-form">Cancel</button>
          <button type="submit" class="btn-mrms btn-primary" id="btn-save-doctor">Save Record</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>
  <div id="loader-overlay" class="loader-overlay">
    <div class="spinner"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/doctors.js"></script>
</body>
</html>
